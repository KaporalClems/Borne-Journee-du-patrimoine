<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journées Européennes du Patrimoine</title>
    <!-- Importation des polices et icônes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Import PDF.js library from the official CDN to ensure it is up-to-date -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>

    <style>
        /* Reset and base font */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            color: white;
            overflow: hidden;
        }

        /* Conteneur pour la vidéo de fond */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Place la vidéo derrière tout le contenu */
            overflow: hidden;
        }

        .video-background video {
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover; /* S'assure que la vidéo couvre tout l'écran */
        }
        
        /* Main container */
        .kiosk-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            background-color: transparent;
            text-align: center;
            position: relative;
            z-index: 1; /* Place le contenu au-dessus de la vidéo */
        }
        
        /* Header with titles */
        .kiosk-header {
            padding: 4vh 4vw;
            flex-shrink: 0;
            position: relative;
        }

        /* Update title colors to white for better visibility on the dark overlay */
        .kiosk-header .main-title,
        .kiosk-header .subtitle,
        .top-right-section {
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        }
        
        .kiosk-header .main-title {
            font-size: 7vh;
            font-weight: 900;
            margin: 1vh 0;
            text-transform: uppercase;
        }

        .kiosk-header .subtitle {
            font-size: 3vh;
            font-weight: 400;
            max-width: 80%;
            margin: 2vh auto 0;
        }
        
        /* Container for date and time */
        .top-right-section {
            position: absolute;
            top: 10vh; /* La valeur a été augmentée pour déplacer le conteneur vers le bas */
            right: 4vw;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1vh;
        }

        #datetime-container {
            font-family: 'Inter', sans-serif;
            text-align: right;
        }

        #datetime-container .time {
            font-size: 3.5vh;
            font-weight: 700;
            line-height: 1;
        }

        #datetime-container .date {
            font-size: 2vh;
            font-weight: 400;
            line-height: 1;
            margin-top: 0.5vh;
        }

        /* Grid for the 4 buttons */
        .app-grid {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2.5vh;
            padding: 2vh 5vw 4vh;
        }

        /* Common button style */
        .app-button {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            padding: 2vh;
            text-decoration: none;
            color: white;
            outline: none;
        }
        
        .app-button:hover, .app-button:focus {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 15px 25px rgba(0,0,0,0.25);
            outline: 3px solid white;
        }
        
        .app-button.disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        .app-button i {
            font-size: 8vh;
            margin-bottom: 2.5vh;
        }
        
        .app-button span {
            font-size: 3vh;
            font-weight: 700;
            text-align: center;
        }
        
        /* Specific colors for each button */
        .color-orange { background-color: #f68122; }
        .color-blue { background-color: #243574; }
        .color-cyan { background-color: #4b88b2; }
        .color-darkblue { background-color: #315185; }
        /* New color for the program button */
        .color-purple { background-color: #6a0dad; }
        /* New color for the satisfaction button */
        .color-green { background-color: #5cb85c; }

        /* Footer */
        .kiosk-footer {
            padding: 1vh;
            background-color: rgba(0, 0, 0, 0.1);
            text-align: center;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .kiosk-footer .footer-text {
            font-size: 1.4vh;
            margin: 0;
        }
        .kiosk-footer .footer-logos {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .kiosk-footer .footer-logos img {
            height: 3vh; /* Adjust logo size */
        }

        /* Modal windows styles */
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7); /* Semi-transparent black background */
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease-in-out forwards;
        }

        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background-color: #2d4c6d;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 80%;
            transform: translateY(-20px);
            animation: slideIn 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        
        /* PDF reader modal style */
        .modal-content.pdf-modal-content {
            background-color: transparent;
            padding: 0;
            width: min(95vw, 95vh);
            height: min(95vw, 95vh);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        /* Map, Gallery, and Program modal styles */
        .modal-content.map-modal-content,
        .modal-content.program-modal-content,
        .modal-content.satisfaction-modal-content,
        .modal-content.video-modal-content {
            background-color: transparent;
            padding: 0;
            width: min(90vw, 90vh);
            height: min(90vw, 90vh);
        }

        /* Specific styling for the program image */
        .program-modal-content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 20px;
        }
        
        .modal-content .close-btn {
            color: white;
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s ease;
            z-index: 1001; /* To be on top of the iframe */
        }
        
        .modal-content.map-modal-content .close-btn,
        .modal-content.program-modal-content .close-btn,
        .modal-content.satisfaction-modal-content,
        .modal-content.video-modal-content .close-btn {
            top: 10px;
            right: 20px;
            color: #333;
            text-shadow: 0 0 5px white;
        }

        .modal-content.pdf-modal-content .close-btn {
            color: white;
            top: 15px;
            right: 25px;
            font-size: 2.5rem;
            text-shadow: 0 0 5px #000;
        }

        .modal-content .close-btn:hover {
            color: #ccc;
        }

        .modal-content h2 {
            font-size: 5vh;
            font-weight: 900;
            margin-top: 0;
        }

        .modal-content p {
            font-size: 2.5vh;
            margin: 2vh 0 4vh;
        }
        
        /* Map iframe style */
        .map-modal-content iframe,
        .satisfaction-modal-content iframe,
        .video-modal-content iframe {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            border: none;
        }

        /* New styles for PDF reader */
        .pdf-reader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        #pdf-viewer {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #f0f0f0;
        }

        .pdf-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        /* Styling for the new page select dropdown */
        .page-select-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        #page-select {
            background-color: #243574;
            color: white;
            border: 2px solid white;
            border-radius: 10px;
            padding: 5px 10px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="white" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
            padding-right: 35px;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        
        #page-select:hover {
            background-color: #1e2a52;
            border-color: #ccc;
        }

        .pdf-controls button {
            background-color: #243574;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .pdf-controls button:disabled {
            background-color: #556891;
            cursor: not-allowed;
        }

        .pdf-controls button:hover {
            background-color: #1e2a52;
            transform: scale(1.1);
        }

        /* Animations for modal */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Styles for video modal, AR modal, and gallery modal */
        .modal-content.ar-modal-content {
            background-color: transparent;
            padding: 0;
            width: 95vw;
            max-width: 1200px;
            height: auto;
        }
        
        /* Media query for tablets */
        @media (max-width: 768px) {
            .modal-content.ar-modal-content {
                width: 95vw;
                max-width: none;
            }
        }

        /* Video/iframe container with 16:9 aspect ratio */
        .video-container,
        .ar-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            border-radius: 20px;
            overflow: hidden; /* To keep rounded corners on the iframe */
        }

        .video-container iframe,
        .ar-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Styles for the button when the movie is available */
        .movie-available {
            font-size: 3vh;
            font-weight: 700;
            text-align: center;
        }

    </style>
</head>
<body>

    <!-- JavaScript for date/time and modal management -->
    <script type="module">
        // Import PDF.js
        const { getDocument, GlobalWorkerOptions } = window.pdfjsLib;

        // Set the workerSrc for PDF.js
        GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

        // Function to update date and time
        function updateDateTime() {
            const now = new Date();
            const timeOptions = { hour: '2-digit', minute: '2-digit' };
            const timeString = now.toLocaleTimeString('fr-FR', timeOptions);
            const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
            const dateString = now.toLocaleDateString('fr-FR', dateOptions);
            document.querySelector('#datetime-container .time').textContent = timeString;
            document.querySelector('#datetime-container .date').textContent = dateString;
        }

        // PDF reader variables
        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        
        // REMPLACEZ CE LIEN PAR L'URL PUBLIQUE DE VOTRE PDF.
        // Un lien de type 'blob' sur GitHub ne fonctionne pas, il faut utiliser le lien 'raw'.
        const url = 'https://raw.githubusercontent.com/KaporalClems/Borne-Journee-du-patrimoine/c6921f3b95f5bf0eafecbc5e1e4815b49ee59866/Livret%20du%20Patrimoine%20%20Ferroviaire-compressed.pdf';

        // Function to render a specific page
        function renderPage(num) {
            pageRendering = true;
            document.getElementById('prev-page-btn').disabled = true;
            document.getElementById('next-page-btn').disabled = true;

            // Use the already loaded document
            if (!pdfDoc) {
                console.error("Document PDF non chargé.");
                return;
            }

            pdfDoc.getPage(num).then(page => {
                const canvas = document.getElementById('pdf-viewer');
                const ctx = canvas.getContext('2d');

                // Calculate the scale to fit the page inside the canvas while preserving aspect ratio
                const container = document.querySelector('.pdf-reader-container');
                const scale = Math.min(container.clientWidth / page.getViewport({ scale: 1 }).width, container.clientHeight / page.getViewport({ scale: 1 }).height);
                const viewport = page.getViewport({ scale: scale });
                
                // Set canvas dimensions based on viewport
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                // Render the page on the canvas
                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                const renderTask = page.render(renderContext);

                // Update the page once rendering is complete
                renderTask.promise.then(() => {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                    // Enable/disable buttons based on page number
                    document.getElementById('prev-page-btn').disabled = pageNum <= 1;
                    document.getElementById('next-page-btn').disabled = pageNum >= pdfDoc.numPages;

                    // Synchronize the dropdown value with the current page
                    document.getElementById('page-select').value = num;
                });
            }).catch(err => {
                console.error('Erreur lors du rendu de la page:', err);
                const canvas = document.getElementById('pdf-viewer');
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear previous content
                ctx.fillStyle = '#ff6347';
                ctx.font = '24px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Erreur de rendu de la page.', canvas.width / 2, canvas.height / 2);
            });
        }

        // Function to manage the rendering queue
        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        // Navigation functions
        function onPrevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        function onNextPage() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        // PDF viewer initialization
        async function initializePdfViewer() {
            try {
                // Fetch the PDF document once
                pdfDoc = await getDocument(url).promise;
                document.getElementById('total-pages').textContent = pdfDoc.numPages;
                
                // Populate the page selection dropdown
                const pageSelect = document.getElementById('page-select');
                // Clear previous options
                pageSelect.innerHTML = '';
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = i;
                    pageSelect.appendChild(option);
                }

                // Add event listener to the dropdown
                pageSelect.addEventListener('change', (event) => {
                    pageNum = parseInt(event.target.value);
                    queueRenderPage(pageNum);
                });

                renderPage(pageNum);
            } catch (err) {
                console.error('Erreur lors du chargement du PDF:', err);
                const canvas = document.getElementById('pdf-viewer');
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff6347';
                ctx.font = '24px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Erreur de chargement du PDF. Veuillez réessayer plus tard.', canvas.width / 2, canvas.height / 2);
            }
        }
        
        // Modal management
        document.addEventListener('DOMContentLoaded', () => {
            // Manage AR modal
            const arButton = document.getElementById('ar-button');
            const arModal = document.getElementById('ar-modal');
            const arCloseBtn = arModal.querySelector('.close-btn');

            arButton.addEventListener('click', (event) => {
                event.preventDefault();
                arModal.classList.add('show');
            });

            arCloseBtn.addEventListener('click', () => {
                arModal.classList.remove('show');
            });

            arModal.addEventListener('click', (event) => {
                if (event.target === arModal) {
                    arModal.classList.remove('show');
                }
            });

            // Manage map modal
            const mapButton = document.getElementById('map-button');
            const mapModal = document.getElementById('map-modal');
            const mapCloseBtn = mapModal.querySelector('.close-btn');

            mapButton.addEventListener('click', (event) => {
                event.preventDefault();
                mapModal.classList.add('show');
            });

            mapCloseBtn.addEventListener('click', () => {
                mapModal.classList.remove('show');
            });

            mapModal.addEventListener('click', (event) => {
                if (event.target === mapModal) {
                    mapModal.classList.remove('show');
                }
            });

            // Manage PDF modal
            const monumentButton = document.getElementById('monument-button');
            const pdfModal = document.getElementById('pdf-modal');
            const pdfCloseBtn = pdfModal.querySelector('.close-btn');

            monumentButton.addEventListener('click', (event) => {
                event.preventDefault();
                pdfModal.classList.add('show');
                initializePdfViewer();
            });

            pdfCloseBtn.addEventListener('click', () => {
                pdfModal.classList.remove('show');
            });

            pdfModal.addEventListener('click', (event) => {
                if (event.target === pdfModal) {
                    pdfModal.classList.remove('show');

            });

            // Manage Program modal
            const programButton = document.getElementById('program-button');
            const programModal = document.getElementById('program-modal');
            const programCloseBtn = programModal.querySelector('.close-btn');

            programButton.addEventListener('click', (event) => {
                event.preventDefault();
                programModal.classList.add('show');
            });

            programCloseBtn.addEventListener('click', () => {
                programModal.classList.remove('show');
            });

            programModal.addEventListener('click', (event) => {
                if (event.target === programModal) {
                    programModal.classList.remove('show');
                }
            });

            // Manage Satisfaction modal
            const satisfactionButton = document.getElementById('satisfaction-button');
            const satisfactionModal = document.getElementById('satisfaction-modal');
            const satisfactionCloseBtn = satisfactionModal.querySelector('.close-btn');

            satisfactionButton.addEventListener('click', (event) => {
                event.preventDefault();
                satisfactionModal.classList.add('show');
            });

            satisfactionCloseBtn.addEventListener('click', () => {
                satisfactionModal.classList.remove('show');
            });

            satisfactionModal.addEventListener('click', (event) => {
                if (event.target === satisfactionModal) {
                    satisfactionModal.classList.remove('show');
                }
            });

            // Manage video modal
            const videoButton = document.getElementById('video-button');
            const videoModal = document.getElementById('video-modal');
            const videoCloseBtn = videoModal.querySelector('.close-btn');

            videoCloseBtn.addEventListener('click', () => {
                videoModal.classList.remove('show');
            });

            videoModal.addEventListener('click', (event) => {
                if (event.target === videoModal) {
                    videoModal.classList.remove('show');
                }
            });
            
            // Event listeners for PDF reader buttons
            document.getElementById('prev-page-btn').addEventListener('click', onPrevPage);
            document.getElementById('next-page-btn').addEventListener('click', onNextPage);

            // Update year in real-time
            document.getElementById('current-year').textContent = new Date().getFullYear();

            // Initialize date and time
            updateDateTime();
            setInterval(updateDateTime, 1000);
            
            // --- Logique du compte à rebours pour le film ---
            const countdownTimer = document.getElementById('countdown-timer');
            const buttonText = document.querySelector('#video-button .button-text');
            
            // Date de diffusion du film (21 septembre 2025 à 17h45 à La Réunion, UTC+4)
            const targetDate = new Date('2025-09-21T17:45:00+04:00');

            function updateCountdown() {
                const now = new Date();
                const difference = targetDate.getTime() - now.getTime();

                if (difference <= 0) {
                    countdownTimer.style.display = 'none';
                    buttonText.textContent = "Diffusion en direct !";
                    // Rendre le bouton cliquable en retirant la classe 'disabled'
                    videoButton.classList.remove('disabled');
                    // Ajouter le gestionnaire d'événements une seule fois
                    if (!videoButton.hasClickListener) {
                        videoButton.addEventListener('click', (event) => {
                            event.preventDefault();
                            videoModal.classList.add('show');
                        });
                        videoButton.hasClickListener = true;
                    }
                    clearInterval(countdownInterval);
                    return;
                }
                
                let remainingTime = difference;
                let countdownString = "";
                
                const days = Math.floor(remainingTime / (1000 * 60 * 60 * 24));
                remainingTime -= days * (1000 * 60 * 60 * 24);
                
                const hours = Math.floor(remainingTime / (1000 * 60 * 60));
                remainingTime -= hours * (1000 * 60 * 60);

                const minutes = Math.floor(remainingTime / (1000 * 60));
                remainingTime -= minutes * (1000 * 60);

                const seconds = Math.floor(remainingTime / 1000);
                
                if (days > 0) {
                    countdownString += `${days} Jours `;
                }
                if (days > 0 || hours > 0) {
                    countdownString += `${hours} Heures `;
                }
                if (days > 0 || hours > 0 || minutes > 0) {
                    countdownString += `${minutes} Minutes `;
                }
                countdownString += `${seconds} Secondes`;

                countdownTimer.textContent = countdownString.trim();
            }
            
            // Initialise le compte à rebours et l'actualise chaque seconde
            updateCountdown();
            const countdownInterval = setInterval(updateCountdown, 1000);
        });
    </script>
